<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>备忘录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;background:#0b0d12;color:#f1f5f9;font-family:system-ui,sans-serif;overflow-x:hidden;}
.header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:#141822;
}
.back-btn{
  font-size:22px;padding:4px 8px;cursor:pointer;user-select:none;
}
.title{font-size:18px;font-weight:500;flex:1;}
.add-btn{
  padding:8px 14px;background:#204890;border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;
}
.content{padding:16px;}
.note-item{
  background:#141822;border-radius:14px;padding:18px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.07);
}
.note-title{font-size:20px;font-weight:500;margin-bottom:6px;}
.note-time{font-size:15px;color:#999;margin-bottom:10px;}
.note-body{font-size:16px;color:#ddd;white-space:pre-wrap;word-break:break-all;}
.note-acts{display:flex;gap:10px;margin-top:14px;}
.btn-edit{
  padding:8px 22px;border:none;border-radius:8px;font-size:15px;
  background:#204890;color:#fff;cursor:pointer;
}
.btn-del{
  padding:8px 22px;border:none;border-radius:8px;font-size:15px;
  background:#882222;color:#fff;cursor:pointer;
}
.empty{text-align:center;padding:80px 20px;color:#888;font-size:16px;}

/* 删除弹窗 */
.del-mask{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;
  display:none;align-items:center;justify-content:center;padding:22px;
}
.del-mask.show{display:flex;}
.del-dialog{
  width:100%;max-width:420px;background:#444444;border-radius:16px;
  overflow:hidden;
}
.del-text{
  padding:32px 24px;text-align:center;font-size:18px;color:#ffffff;
}
.del-buttons{
  display:flex;border-top:1px solid #555;
}
.del-buttons button{
  flex:1;padding:14px 0;border:none;font-size:16px;cursor:pointer;
}
.btn-cancel{
  background:transparent;color:#88dddd;
}
.btn-confirm{
  background:transparent;color:#ff6666;
}

/* 编辑/新建弹窗 */
.edit-mask{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:99;
  display:none;align-items:center;justify-content:center;padding:22px;
}
.edit-mask.show{display:flex;}
.edit-dialog{
  width:100%;max-width:440px;background:#141822;border-radius:18px;padding:22px;
}
.edit-dialog h3{margin-bottom:14px;font-size:17px;}
.edit-dialog input,.edit-dialog textarea{
  width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:#0b0d12;color:#f1f5f9;font-size:14px;margin-bottom:12px;
}
.edit-dialog textarea{min-height:160px;resize:vertical;}
.edit-buttons{display:flex;gap:10px;justify-content:flex-end;}
.edit-buttons button{
  padding:10px 18px;border:none;border-radius:10px;cursor:pointer;font-size:14px;
}
.btn-edit-cancel{background:#333844;color:#fff;}
.btn-edit-save{background:#204890;color:#fff;}
</style>
</head>
<body>
<div class="header">
  <div class="back-btn" onclick="goBack()">←</div>
  <div class="title">备忘录</div>
  <button class="add-btn" onclick="openAdd()">+ 新建</button>
</div>
<div class="content" id="pageContent"></div>

<!-- 删除弹窗 -->
<div class="del-mask" id="delMask">
  <div class="del-dialog">
    <div class="del-text">确定删除这条笔记？不可恢复！</div>
    <div class="del-buttons">
      <button class="btn-cancel" onclick="closeDelMask()">取消</button>
      <button class="btn-confirm" id="confirmDelBtn">删除</button>
    </div>
  </div>
</div>

<!-- 新建 / 编辑弹窗 -->
<div class="edit-mask" id="editMask">
  <div class="edit-dialog">
    <h3 id="editTitle">新建笔记</h3>
    <input id="inpTitle" placeholder="笔记标题">
    <textarea id="inpBody" placeholder="输入笔记内容…"></textarea>
    <input type="hidden" id="editIndex" value="-1">
    <div class="edit-buttons">
      <button class="btn-edit-cancel" onclick="closeEditMask()">取消</button>
      <button class="btn-edit-save" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<script>
// 返回（iframe 回到桌面）
function goBack(){
  if(window.parent !== window){
    parent.postMessage(JSON.stringify({type:"backPage"}),"*");
  }
}
window.addEventListener('popstate',function(e){
  e.preventDefault();
  goBack();
  history.pushState(null, null, location.href);
});
history.pushState(null, null, location.href);

let noteList = JSON.parse(localStorage.getItem("localNoteList")||"[]");
let deleteIndex = -1;

function saveStorage(){
  localStorage.setItem("localNoteList",JSON.stringify(noteList));
}

function escapeHtml(s){
  if(!s) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function render(){
  const box = document.getElementById("pageContent");
  if(noteList.length===0){
    box.innerHTML=`<div class="empty">暂无笔记，点击右上角新建创建</div>`;
    return;
  }
  let html = "";
  noteList.forEach((item,idx)=>{
    html+=`
    <div class="note-item">
      <div class="note-title">${escapeHtml(item.title)||"无标题"}</div>
      <div class="note-time">${item.time}</div>
      <div class="note-body">${escapeHtml(item.body)}</div>
      <div class="note-acts">
        <button class="btn-edit" onclick="openEdit(${idx})">编辑</button>
        <button class="btn-del" onclick="openDelMask(${idx})">删除</button>
      </div>
    </div>
    `;
  });
  box.innerHTML = html;
}

// 删除弹窗
function openDelMask(idx){
  deleteIndex = idx;
  document.getElementById("delMask").classList.add("show");
}
function closeDelMask(){
  document.getElementById("delMask").classList.remove("show");
  deleteIndex = -1;
}
// 点击遮罩关闭删除弹窗
document.getElementById("delMask").onclick = function(e){
  if(e.target === this) closeDelMask();
};
document.getElementById("confirmDelBtn").onclick = function(){
  if(deleteIndex >= 0){
    noteList.splice(deleteIndex, 1);
    saveStorage();
    render();
  }
  closeDelMask();
};

// 新建 / 编辑
function openAdd(){
  document.getElementById("editTitle").innerText="新建笔记";
  document.getElementById("inpTitle").value="";
  document.getElementById("inpBody").value="";
  document.getElementById("editIndex").value="-1";
  document.getElementById("editMask").classList.add("show");
}
function openEdit(idx){
  const item = noteList[idx];
  document.getElementById("editTitle").innerText="编辑笔记";
  document.getElementById("inpTitle").value=item.title;
  document.getElementById("inpBody").value=item.body;
  document.getElementById("editIndex").value=idx;
  document.getElementById("editMask").classList.add("show");
}
function closeEditMask(){
  document.getElementById("editMask").classList.remove("show");
}
// 点击遮罩关闭编辑弹窗
document.getElementById("editMask").onclick = function(e){
  if(e.target === this) closeEditMask();
};
function saveNote(){
  const title = document.getElementById("inpTitle").value.trim();
  const body = document.getElementById("inpBody").value.trim();
  const editIdx = Number(document.getElementById("editIndex").value);
  const now = new Date().toLocaleString();

  if(editIdx === -1){
    noteList.unshift({title,body,time:now});
  }else{
    noteList[editIdx].title = title;
    noteList[editIdx].body = body;
    noteList[editIdx].time = now;
  }
  saveStorage();
  closeEditMask();
  render();
}

render();
</script>
</body>
</html>
