<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>进恩哥系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system}

.boot{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0d0d1a,#12123a,#1a1a5c);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.boot-logo{
  width:90px;
  height:90px;
  margin-bottom:24px;
  border-radius:14px;
  opacity:0;
  /* 2秒后开始霓虹呼吸 */
  animation:logoFade 2 ease-in-out forwards, neonBlink 2.2 infinite ease-in-out 2;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:40px;
  opacity:0;
  animation:logoFade 2 ease-in-out forwards;
}

.progress-wrap{
  width:220px;
  height:6px;
  background:rgba(255,255,255,0.15);
  border-radius:999px;
  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  background:#ffffff;
  border-radius:999px;
  animation:progress 5 linear forwards;
}

.tip{
  margin-top:12px;
  font-size:12px;
  color:#aaa;
  opacity:0;
  animation:fade 7 ease forwards;
}

@keyframes logoFade{
  0%{opacity:0;transform:scale(0.8);}
  100%{opacity:1;transform:scale(1);}
}
/*霓虹呼吸发光*/
@keyframes neonBlink{
  0%{box-shadow:0 0 8px #5066ff,0 0 16px #7b3cff,0 0 28px #3928ff;}
  50%{box-shadow:0 0 16px #5066ff,0 0 32px #7b3cff,0 0 48px #3928ff;}
  100%{box-shadow:0 0 8px #5066ff,0 0 16px #7b3cff,0 0 28px #3928ff;}
}

/* 七彩进度动画：宽度+颜色同步变化 */
@keyframes progress {
  0%{width:0%;background:#ff0000;}
  20%{width:20%;background:#ff9900;}
  40%{width:40%;background:#ffff00;}
  60%{width:60%;background:#00cc00;}
  80%{width:80%;background:#0099ff;}
  100%{width:100%;background:#9933ff;}
}

/* 七彩淡入：透明度+颜色渐变 */
@keyframes fade {
  0%{opacity:0;color:red;}
  25%{opacity:0.4;color:orange;}
  50%{opacity:0.7;color:yellow;}
  75%{opacity:0.9;color:#00cc66;}
  100%{opacity:1;color:#6633ff;}
}

</style>
</head>

<body>
<div class="boot">
  <img class="boot-logo" src="favicon.png" alt="favicon">
  <div class="logo">进恩哥系统</div>
  <div class="progress-wrap">
    <div class="progress"></div>
  </div>
<style>
.linux-boot {
  background: #000;
  padding: 10px;
  font-family: Consolas, "Monospace";
  color: #39ff14;
  width: 100%;
  max-width: 600px;
  height: 220px;
  overflow: hidden;
}
.boot-log {
  line-height: 1.4;
  font-size: 13px;
}
.tip {
  margin-top:6px;
  border-right:3px solid #39ff14;
  animation: blink 1 infinite;
  white-space:nowrap;
}
@keyframes blink {
  0%,100% {border-color:#39ff14}
  50% {border-color:transparent}
}
</style>
</head>
<body>
<div class="linux-boot">
  <div class="boot-log" id="log"></div>
  <div class="tip">正在加载核心服务…</div>
</div>
  </div>
<script>
const logs = [
  "[  OK  ] Mounted /sys.",
  "[  OK  ] Mounted /proc.",
  "[  OK  ] Started udev Kernel Device Manager.",
  "[ INFO ] Loading system hardware drivers...",
  "[  OK  ] Loaded network stack module.",
  "[  OK  ] Started SysFS init service.",
  "[ INFO ] Initializing core service",
  "[  OK  ] Core service loaded successfully"
];
const logDom = document.getElementById('log');
let index = 0;
function addLog(){
  if(index < logs.length){
    logDom.innerHTML += logs[index]+'<br>';
    index++;
    setTimeout(addLog,100);
  }else{
    setTimeout(()=>{logDom.innerHTML='';index=0;addLog()},3000)
  }
}
addLog();
</script>

<audio id="startAudio" preload="auto">
  <source src="./Loading.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById('startAudio');
audio.volume = 0.7;
let playFlag = false;

// 本地文件直接尝试自动播放
setTimeout(()=>{
  audio.play().then(()=>{playFlag=true}).catch(()=>{});
},500)

// 浏览器禁止自动播放时，点击页面播放
document.body.addEventListener('click',()=>{
    if(!playFlag){
        playFlag = true;
        audio.currentTime = 0;
        audio.play().catch(e=>{});
    }
},{once:true})

// 7秒跳转
setTimeout(()=>{
    window.location.href = "Launcher.html";
},7000)
</script>

</body>
</html>
