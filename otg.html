<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="shortcut icon" href="images/Update.png" type="image/x-icon">
    <link rel="stylesheet" href="mdui-v1.0.1/css/mdui.min.css">
    <script src="mdui-v1.0.1/js/mdui.min.js"></script>
    <title>系统更新</title>
    <style>
        * {
            scrollbar-width: thin;
        }
        /* 全局冷深色背景，无黄调 */
        body {
            background: linear-gradient(140deg, #08081a 0%, #0c0c2c 50%, #060622 100%);
            min-height: 100vh;
            margin: 0;
        }
        /* 更新卡片 深浅双适配，文字高对比度 */
        #card {
            width: 70%;
            height: 70%;
            max-width: 640px;
            max-height: 640px;
            position: absolute;
            padding: 32px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,0.08);
            box-shadow: 0 0 16px rgba(92, 47, 194, 0.15);
            animation-name: opacity;
            animation-delay: .4s;
            animation-duration: .2s;
            animation-fill-mode: forwards;
            opacity: 0;
            overflow-y: scroll;
        }
        /* 浅色模式卡片 */
        body:not(.mdui-theme-layout-dark) #card {
            background: #ffffff;
            color: #000000;
        }
        /* 深色模式卡片 */
        body.mdui-theme-layout-dark #card {
            background: #101030;
            color: #e8edff;
        }
        @keyframes opacity {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        #title {
            font-size: 24px;
            font-weight: 600;
        }
        #spinner {
            padding: 16px;
        }
        #updateButton,
        #backButton {
            display: none;
            margin-bottom: 32px;
        }
        /* 按钮渐变冷色系，不刺眼 */
        .mdui-btn {
            border-radius: 32px;
            background: linear-gradient(90deg, #5c2fc2, #0099cc) !important;
            color: #fff !important;
        }
        /* 图标配色适配 */
        .mdui-text-color-theme-accent {
            color: #0099cc !important;
        }
        /* 滚动条美化 */
        #card::-webkit-scrollbar {
            width: 4px;
        }
        #card::-webkit-scrollbar-thumb {
            background: rgba(255,255,0.15);
            border-radius: 2px;
        }
    </style>
</head>
<body class="mdui-theme-primary-blue mdui-theme-accent-blue">
    <div id="card">
        <i class="mdui-icon material-icons mdui-text-color-theme-accent" style="font-size: 32px;">system_update</i>
        <p id="title">正在检查更新......</p>
        <p id="versionName"></p>
        <p id="date"></p>
        <p id="content"></p>
        <br>
        <div id="updateButton">
            <button class="mdui-btn mdui-ripple mdui-float-right" onclick="javascript:update();">更新</button>
        </div>
        <div id="backButton">
            <button class="mdui-btn mdui-ripple mdui-float-right" onclick="javascript:goBack();">返回</button>
        </div>
        <div id="spinner">
            <div class="mdui-spinner mdui-center"></div>
        </div>
    </div>
    <script>
        // 全局工具函数
        function gebi(id) {
            return document.getElementById(id);
        }
        //页面加载逻辑
        window.onload = function() {
            var card = document.getElementById("card");
            window.setInterval(function() {
                card.style.top = "calc(50% - " + card.clientHeight / 2 + "px)";
                card.style.left = "calc(50% - " + card.clientWidth / 2 + "px)";
            }, 100);
            checkUpdate();
            // 深色模式切换卡片与状态栏
            if (localStorage.getItem("darkTheme") == "true") {
                document.body.classList.add("mdui-theme-layout-dark");
                card.style.background = "#101030";
                card.style.color = "#e8edff";
                postScript(function() {
                    gebi("statusBar").style.background = "#08081a";
                    gebi("statusBar").style.color = "#fff";
                });
            } else {
                postScript(function() {
                    gebi("statusBar").style.background = "#4B81DA";
                    gebi("statusBar").style.color = "#fff";
                });
            }
        };
        //接入 API：执行 JavaScript 脚本
        function postScript(script) {
            var scriptStr = script.toString();
            var postData = {
                "type": "JavaScript",
                "script": scriptStr
            };
            window.parent.postMessage(JSON.stringify(postData), "/");
        }
        //处理更新信息
        function processUpdate() {
            document.getElementById("spinner").style = updateData.spinner;
            document.getElementById("versionName").innerText = "版本名称：" + updateData.versionName;
            document.getElementById("date").innerText = "更新日期：" + updateData.updateDate;
            document.getElementById("content").innerHTML = "更新内容：<p>" + updateData.change + "</p>";
            //版本对比
            if (versionCode < updateData.versionCode) {
                document.getElementById("title").innerText = "有可用的系统更新";
                document.getElementById("updateButton").style.display = "inline-block";
                document.getElementById("backButton").style.display = "inline-block";
                document.getElementById("backButton").style.float = "left";
                document.getElementById("updateButton").style.float = "right";
            } else {
                document.getElementById("title").innerText = "已是最新版本";
                document.getElementById("backButton").style.display = "inline-block";
                document.getElementById("backButton").style.float = "right";
            }
        }
        //跳转更新下载页
        function update() {
            postScript(function() {
                window.open("update.html", "_blank");
            });
        }
        //返回上一页
        function goBack() {
            postScript(function() {
                gebi('navBack').click();
            });
        }
    </script>
    <script src="Update.js"></script>
</body>
</html>
