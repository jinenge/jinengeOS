<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>开发者选项</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;background:#08090c;color:#e8e9ec;font-family:system-ui,sans-serif;overflow-x:hidden;}
.container{padding:16px;}
.back-wrap{margin-bottom:16px;}
.back-btn{
  display:inline-block;
  background:#209048;color:#fff;padding:12px 32px;border-radius:999px;
  border:none;font-size:16px;cursor:pointer;
}
.page-title{font-size:22px;font-weight:bold;margin-bottom:8px;}
.tip-text{color:#f5c848;font-size:14px;margin-bottom:24px;}

/* 列表项 */
.item{
  background:#1c2c42;border-radius:14px;padding:18px 16px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.06);
  display:flex;justify-content:space-between;align-items:center;
}
.item-left .name{font-size:17px;margin-bottom:4px;}
.item-left .desc{font-size:13px;color:#b8c8dd;}

/* 开关 */
.toggle{
  width:48px;height:28px;border-radius:999px;background:#333;
  position:relative;cursor:pointer;
}
.toggle .dot{
  width:22px;height:22px;background:#fff;border-radius:50%;
  position:absolute;top:3px;left:3px;
}
.toggle.on{background:#4488dd;}
.toggle.on .dot{left:23px;}

/* 最小宽度 */
.dp-area{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;
  max-width:220px;
}
.dp-area input{
  width:60px;padding:5px;border-radius:6px;border:none;background:#222;color:#fff;text-align:center;font-size:15px;
}
.dp-btn{
  padding:5px 8px;border:none;border-radius:6px;background:#2f3f55;color:#ddd;font-size:14px;cursor:pointer;
}
.dp-btn-group{
  display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;margin-top:6px;
}
.dp-btn-group .dp-btn{
  min-width:52px;
}

/* 重置按钮 */
.btn-reset-all{
  width:100%;margin-top:20px;padding:18px 0;border:none;border-radius:12px;
  background:#992222;color:#fff;font-size:18px;cursor:pointer;
}

/* 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:120;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.mask.show{display:flex;}
.dialog{
  width:100%;max-width:420px;background:#444444;border-radius:16px;overflow:hidden;
}
.dialog-text{
  padding:32px 24px;text-align:center;font-size:18px;color:#ffffff;
  line-height:1.5;
}
.dialog-buttons{
  display:flex;border-top:1px solid #555;
}
.dialog-buttons button{
  flex:1;padding:14px 0;border:none;font-size:16px;cursor:pointer;
}
.btn-cancel{background:transparent;color:#88dddd;}
.btn-ok{background:transparent;color:#ff5555;}
</style>
</head>
<body>
<div class="container">
  <div class="back-wrap">
    <button class="back-btn" onclick="goBack()">← 返回</button>
  </div>
  <h1 class="page-title">开发者选项</h1>
  <div class="tip-text">⚠️ 仅供调试，开启部分功能会影响系统体验</div>

  <div class="item">
    <div class="item-left">
      <div class="name">显示触摸位置</div>
      <div class="desc">点击屏幕出现红点指示器</div>
    </div>
    <div class="toggle" id="toggleTouch" onclick="switchToggle(this)"><div class="dot"></div></div>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="name">显示布局边界</div>
      <div class="desc">给所有控件绘制边框轮廓</div>
    </div>
    <div class="toggle" id="toggleLayout" onclick="switchToggle(this)"><div class="dot"></div></div>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="name">关闭全部动画</div>
      <div class="desc">页面弹窗切换无过渡动画</div>
    </div>
    <div class="toggle" id="toggleAnim" onclick="switchToggle(this)"><div class="dot"></div></div>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="name">强制硬件加速</div>
      <div class="desc">开启 GPU 复合渲染</div>
    </div>
    <div class="toggle" id="toggleGpu" onclick="switchToggle(this)"><div class="dot"></div></div>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="name">最小宽度（模拟小屏）</div>
      <div class="desc">当前：<span id="dpVal">400</span> dp</div>
      <div class="dp-btn-group">
        <button class="dp-btn" onclick="setDpVal(320)">320</button>
        <button class="dp-btn" onclick="setDpVal(360)">360</button>
        <button class="dp-btn" onclick="setDpVal(400)">400</button>
        <button class="dp-btn" onclick="setDpVal(480)">480</button>
        <button class="dp-btn" onclick="setDpVal(600)">600</button>
        <button class="dp-btn" onclick="setDpVal(720)">720</button>
      </div>
    </div>
    <div class="dp-area">
      <input type="text" id="dpInput" value="400">
      <button class="dp-btn" onclick="applyDp()">确定</button>
      <button class="dp-btn" onclick="resetDp()">重置</button>
    </div>
  </div>

  <button class="btn-reset-all" onclick="openResetDialog()">重置开发者选项</button>
</div>

<!-- 重置弹窗 -->
<div class="mask" id="resetMask">
  <div class="dialog">
    <div class="dialog-text">⚠️ 确定重置？清除全部调试设置并关闭开发者模式</div>
    <div class="dialog-buttons">
      <button class="btn-cancel" onclick="closeResetDialog()">取消</button>
      <button class="btn-ok" id="confirmResetBtn">确定</button>
    </div>
  </div>
</div>

<script>
// 返回回到桌面
function goBack(){
  if(window.parent !== window){
    parent.postMessage(JSON.stringify({type:"backPage"}),"*");
  }
}
window.addEventListener('popstate',function(e){
  e.preventDefault();
  goBack();
  history.pushState(null, null, location.href);
});
history.pushState(null, null, location.href);

// 获取当前配置对象
function getConfigObj(){
  return {
    touchPoint: document.getElementById('toggleTouch').classList.contains('on'),
    layoutBorder: document.getElementById('toggleLayout').classList.contains('on'),
    zeroAnim: document.getElementById('toggleAnim').classList.contains('on'),
    forceGpu: document.getElementById('toggleGpu').classList.contains('on'),
    minWidthDp: Number(document.getElementById('dpInput').value)
  }
}

// 开关点击
function switchToggle(el){
  el.classList.toggle('on');
  syncToParent();
}

// 设置dp快捷按钮
function setDpVal(val){
  document.getElementById('dpInput').value = val;
  document.getElementById('dpVal').innerText = val;
  syncToParent();
}
function applyDp(){
  let v = Number(document.getElementById('dpInput').value);
  if(isNaN(v) || v <240 || v>1200) v=400;
  document.getElementById('dpInput').value = v;
  document.getElementById('dpVal').innerText = v;
  syncToParent();
}
function resetDp(){
  setDpVal(400);
}

// 同步配置给父页面（关键！）
function syncToParent(){
  const cfg = getConfigObj();
  localStorage.setItem("devConfig", JSON.stringify(cfg));
  if(window.parent !== window){
    parent.postMessage(JSON.stringify({
      type:"devConfig",
      payload: cfg
    }),"*");
  }
}

// 弹窗
function openResetDialog(){
  document.getElementById('resetMask').classList.add('show');
}
function closeResetDialog(){
  document.getElementById('resetMask').classList.remove('show');
}
document.getElementById('resetMask').onclick = function(e){
  if(e.target === this) closeResetDialog();
};
document.getElementById('confirmResetBtn').onclick = function(){
  localStorage.removeItem("devConfig");
  localStorage.removeItem("devMode");
  if(window.parent !== window){
    parent.postMessage(JSON.stringify({type:"devConfigReset"}),"*");
  }
  closeResetDialog();
  location.reload();
}

// 页面加载读取本地，初始化UI
function loadUi(){
  const raw = localStorage.getItem("devConfig");
  if(!raw) return;
  const cfg = JSON.parse(raw);
  if(cfg.touchPoint) document.getElementById("toggleTouch").classList.add("on");
  if(cfg.layoutBorder) document.getElementById("toggleLayout").classList.add("on");
  if(cfg.zeroAnim) document.getElementById("toggleAnim").classList.add("on");
  if(cfg.forceGpu) document.getElementById("toggleGpu").classList.add("on");
  if(cfg.minWidthDp){
    document.getElementById('dpInput').value = cfg.minWidthDp;
    document.getElementById('dpVal').innerText = cfg.minWidthDp;
  }
}
loadUi();
</script>
</body>
</html>
