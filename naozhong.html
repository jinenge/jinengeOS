<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多功能闹钟</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  font-family:system-ui, -apple-system, sans-serif;
  color:#ffffff;
  overflow:hidden;
}
body{
  background:#050510;
}
/* 流动七彩渐变动画背景 */
.rainbow-wrap{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(45deg, #ff3366, #ff9933, #ffee33, #33ff99, #33ccff, #9966ff, #ff3366);
  background-size: 400% 400%;
  animation: rainbowFlow 12s ease infinite;
  opacity: 0.28;
}
@keyframes rainbowFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.container{
  width:100%;
  height:100%;
  position:relative;
  z-index:1;
  overflow:hidden;
}
/* 右上角横竖屏切换按钮 */
.orientation-btn{
  position:fixed;
  top:14px;
  right:14px;
  z-index: 950;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(20,20,35,0.55);
  backdrop-filter: blur(14px);
  color:#cfe9ff;
  font-size: 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  transition: 0.25s ease;
}
.orientation-btn:active{
  background: rgba(57,255,136,0.25);
  color:#39ff88;
  border-color: rgba(57,255,136,0.45);
}
/* 时钟主页 */
.clock-main-page{
  display:none;
  height:100%;
  width:100%;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding: 80px 24px 120px;
}
.clock-main-page.active{
  display:flex;
}
.clock-main-page .big-time{
  font-weight: 900;
  letter-spacing: 6px;
  color:#ffffff;
  text-shadow:
    0 0 25px rgba(255,255,255,0.4),
    0 0 60px rgba(120,220,255,0.5),
    0 0 120px rgba(255,110,210,0.4);
  line-height: 1;
  white-space: nowrap;
}
.clock-main-page .big-date{
  font-weight: 300;
  color:#eef6ff;
  opacity: 0.82;
  text-shadow: 0 0 8px rgba(100,200,255,0.25);
  margin-top: 14px;
}
.clock-main-page .holiday-count{
  margin-top:12px;
  font-size:16px;
  color:#ffdd77;
  text-shadow:0 0 10px rgba(255,200,80,0.35);
}
/* 竖屏：按手机自适应，防止显示不全 */
@media (orientation: portrait) {
  .clock-main-page .big-time{
    font-size: 80px;
    letter-spacing: 4px;
  }
  .clock-main-page .big-date{
    font-size: 20px;
  }
  .clock-main-page .holiday-count{
    font-size:14px;
  }
}
/* 横屏：锁定超大时钟，日期加大 */
@media (orientation: landscape) {
  .clock-main-page .big-time{
    font-size: 260px !important;
    letter-spacing: 8px;
  }
  .clock-main-page .big-date{
    font-size: 26px;
  }
  .clock-main-page .holiday-count{
    font-size:20px;
  }
}
/* 其他页面 */
.page{
  display:none;
  width:100%;
  height:100%;
  overflow-y:auto;
  padding: 16px;
  padding-bottom: 90px;
}
.page.active{
  display:block;
}
.card{
  background:rgba(255,255,255,0.06);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  border: 1px solid rgba(57,255,136,0.22);
  backdrop-filter: blur(10px);
}
.toggle-add-btn{
  display:block;
  width:100%;
  max-width: 360px;
  margin:0 auto 16px;
  padding:14px 22px;
  border:none;
  border-radius:18px;
  background:#2888dd;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.25s ease;
}
.toggle-add-btn:active{
  opacity:0.85;
}
.slide-add-area{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease;
}
.slide-add-area.open{
  max-height:1400px;
}
.time-picker-wrap{
  display:flex;
  justify-content:center;
  gap:14px;
  align-items:center;
  margin:16px 0;
}
.time-col{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.time-col button{
  width:48px;
  height:40px;
  border:none;
  background:#1c1c30;
  color:#39ff88;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
}
.time-col .val{
  width:74px;
  text-align:center;
  font-size:32px;
  padding:10px 0;
  color:#39ff88;
  cursor:pointer;
  border-radius:8px;
  transition:0.2s;
}
.time-col .val:hover{
  background:rgba(57,255,136,0.08);
}
.time-col .val input{
  width:100%;
  text-align:center;
  background:transparent;
  border:none;
  color:#39ff88;
  font-size:32px;
  outline:none;
}
.label-small{
  font-size:12px;
  color:#888;
  margin-top:4px;
}
/* 淡化悬浮底部 Tab */
.tab-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(12,12,22,0.62);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display:flex;
  justify-content:space-around;
  padding: 8px 4px 18px;
  z-index: 900;
}
.tab-item{
  text-align:center;
  font-size:13px;
  color:#666;
  cursor:pointer;
  padding: 7px 8px;
  border-radius: 999px;
  transition:0.25s ease;
  flex:1;
  margin:0 2px;
}
.tab-item.clock.active{
  background:#39ff8822;
  color:#39ff88;
  box-shadow:0 0 12px #39ff8833;
}
.tab-item.alarm.active{
  background:#39ff8822;
  color:#39ff88;
  box-shadow:0 0 12px #39ff8833;
}
.tab-item.stopwatch.active{
  background:#ffdd4422;
  color:#ffdd44;
  box-shadow:0 0 12px #ffdd4433;
}
.tab-item.world.active{
  background:#44ccff22;
  color:#44ccff;
  box-shadow:0 0 12px #44ccff33;
}
.tab-item.countdown.active{
  background:#ff66aa22;
  color:#ff66aa;
  box-shadow:0 0 12px #ff66aa33;
}
.btn{
  padding:11px 14px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-size:14px;
  transition:0.2s;
}
.btn-primary{
  background:#39ff88;
  color:#081810;
  font-weight:600;
}
.btn-success{
  background:#39ff88;
  color:#081810;
  font-weight:600;
}
.btn-danger{
  background:#222;
  color:#ff6677;
}
.btn-blue{
  background:#2888dd;
  color:#fff;
}
.btn-purple{
  background:#8844dd;
  color:#fff;
}
.row-flex{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  margin-top:12px;
}
.select-box,.input-text{
  padding:10px 12px;
  border-radius:12px;
  background:#181828;
  color:#fff;
  border:none;
  font-size:15px;
  min-width:100px;
}
.select-box option{
  background:#181828;
  color:#fff;
}
.empty-tip{
  text-align:center;
  color:#666;
  padding:32px 0;
}
.alarm-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:rgba(255,255,255,0.045);
  border-radius:18px;
  margin-bottom:10px;
  border:1px solid rgba(57,255,136,0.12);
  flex-wrap: wrap;
  gap:10px;
}
.alarm-info .t{
  font-size:26px;
  color:#39ff88;
}
.alarm-info .desc{
  font-size:12px;
  color:#999;
  margin-top:3px;
}
.toggle{
  width:48px;
  height:26px;
  border-radius:999px;
  background:#333;
  position:relative;
  cursor:pointer;
  margin-right:10px;
}
.toggle.on{
  background:#39ff88;
}
.toggle.on::after{
  background:#081810;
}
.toggle::after{
  content:"";
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:0.22s;
}
.toggle.on::after{
  left:24px;
}
.stopwatch-display{
  font-size:52px;
  text-align:center;
  color:#ffdd44;
  margin:20px 0;
}
.lap-item{
  padding:6px 0;
  color:#aaa;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.countdown-display{
  font-size:48px;
  text-align:center;
  color:#ff66aa;
  margin:20px 0;
}
.world-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.world-item:last-child{
  border-bottom:none;
}
.world-city{
  color:#ddd;
}
.world-time{
  color:#44ccff;
}
.mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}
.dialog{
  width:100%;
  max-width:360px;
  background:#141424;
  border-radius:28px;
  padding:32px 26px;
  text-align:center;
  border:1px solid #39ff88;
}
.dialog h3{
  font-size:22px;
  color:#39ff88;
  margin-bottom:8px;
}
.dialog p{
  color:#aaa;
  margin-bottom:24px;
}
.dialog-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.dialog-buttons .btn{
  flex:1;
  padding:13px 0;
}
</style>
</head>
<body>
<div class="rainbow-wrap"></div>
<!-- 右上角横竖屏切换按钮 -->
<div class="orientation-btn" id="orientationBtn" title="切换横竖屏">
  ⇄
</div>
<div class="container">
  <!-- 超大时钟主页，增加节日倒计时 -->
  <div id="pageClock" class="clock-main-page active">
    <div class="big-time" id="mainBigTime">00:00:00</div>
    <div class="big-date" id="mainBigDate"></div>
    <div class="holiday-count" id="holidayCount">--</div>
  </div>
  <!-- 闹钟 -->
  <div id="pageAlarm" class="page">
    <button class="toggle-add-btn" id="toggleAddBtn">▼ 添加闹钟</button>
    <div class="slide-add-area" id="slideAddBox">
      <div class="card">
        <div style="text-align:center;margin-bottom:10px;">添加闹钟</div>
        <div class="time-picker-wrap">
          <div class="time-col">
            <button id="hUp">▲</button>
            <div class="val" id="hValWrap">
              <span id="hValText">07</span>
            </div>
            <div class="label-small">时</div>
            <button id="hDown">▼</button>
          </div>
          <div class="val">:</div>
          <div class="time-col">
            <button id="mUp">▲</button>
            <div class="val" id="mValWrap">
              <span id="mValText">00</span>
            </div>
            <div class="label-small">分</div>
            <button id="mDown">▼</button>
          </div>
        </div>
        <div class="row-flex">
          <input class="input-text" id="alarmLabel" placeholder="闹钟标签（起床）">
          <select class="select-box" id="ringSelect">
            <option value="beep">滴答蜂鸣</option>
            <option value="alarm">警报铃声</option>
            <option value="soft">舒缓铃声</option>
            <option value="fast">急促闹铃</option>
            <option value="chime">清脆钟鸣</option>
            <option value="wave">水波舒缓</option>
            <option value="bright">明亮提示</option>
            <option value="bell1">复古铃铛</option>
            <option value="bell2">叮咚门铃</option>
            <option value="sweep">扫频警报</option>
            <option value="melody1">短旋律A</option>
            <option value="melody2">短旋律B</option>
            <option value="buzz1">低频蜂鸣</option>
            <option value="buzz2">高频哔声</option>
            <option value="gentle">温柔唤醒</option>
            <option value="horn">号角提示</option>
            <option value="twinkle">闪烁音符</option>
            <option value="rhythm">节奏提示音</option>
            <option value="metro">节拍器</option>
            <option value="custom">自定义本地铃声</option>
          </select>
          <button class="btn btn-purple" id="previewRingBtn">预览铃声</button>
        </div>
        <div class="row-flex">
          <input type="file" id="customRingFile" accept="audio/*">
        </div>
        <div class="row-flex">
          <select class="select-box" id="repeatSelect">
            <option value="once">仅一次</option>
            <option value="workday">工作日</option>
            <option value="daily">每天</option>
            <option value="weekend">周末</option>
          </select>
          <input class="input-text" id="snoozeInput" value="5" placeholder="延迟分钟">
          <label style="font-size:13px;color:#888;">震动：</label>
          <input type="checkbox" id="vibrateSwitch">
          <button class="btn btn-primary" id="addAlarmBtn">添加闹钟</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div style="margin-bottom:10px;">闹钟列表</div>
      <div id="alarmList"></div>
    </div>
  </div>

  <!-- 秒表 -->
  <div id="pageStopwatch" class="page">
    <div class="card">
      <div class="stopwatch-display" id="stopwatchTime">00:00:00.00</div>
      <div class="row-flex">
        <button class="btn btn-success" id="swStart">开始</button>
        <button class="btn btn-blue" id="swLap">计次</button>
        <button class="btn btn-danger" id="swReset">重置</button>
      </div>
      <div id="lapList" style="margin-top:16px;"></div>
    </div>
  </div>

  <!-- 世界时间 -->
  <div id="pageWorld" class="page">
    <div class="card">
      <div style="margin-bottom:12px;">世界时间</div>
      <div id="worldList"></div>
    </div>
  </div>

  <!-- 倒计时 -->
  <div id="pageCountdown" class="page">
    <div class="card">
      <div style="margin-bottom:10px;">倒计时</div>
      <div class="countdown-display" id="cdTime">00:00:00</div>
      <div class="time-picker-wrap">
        <div class="time-col">
          <button id="cdHUp">▲</button>
          <div class="val" id="cdHValWrap">
            <span id="cdHValText">00</span>
          </div>
          <div class="label-small">时</div>
          <button id="cdHDown">▼</button>
        </div>
        <div class="val">:</div>
        <div class="time-col">
          <button id="cdMUp">▲</button>
          <div class="val" id="cdMValWrap">
            <span id="cdMValText">05</span>
          </div>
          <div class="label-small">分</div>
          <button id="cdMDown">▼</button>
        </div>
        <div class="val">:</div>
        <div class="time-col">
          <button id="cdSUp">▲</button>
          <div class="val" id="cdSValWrap">
            <span id="cdSValText">00</span>
          </div>
          <div class="label-small">秒</div>
          <button id="cdSDown">▼</button>
        </div>
      </div>
      <div class="row-flex">
        <button class="btn btn-success" id="cdStart">开始</button>
        <button class="btn btn-danger" id="cdReset">重置</button>
      </div>
    </div>
  </div>
</div>

<!-- 底部 Tab -->
<div class="tab-bar">
  <div class="tab-item clock active" data-page="pageClock">时钟</div>
  <div class="tab-item alarm" data-page="pageAlarm">闹钟</div>
  <div class="tab-item stopwatch" data-page="pageStopwatch">秒表</div>
  <div class="tab-item world" data-page="pageWorld">世界时间</div>
  <div class="tab-item countdown" data-page="pageCountdown">倒计时</div>
</div>

<!-- 删除弹窗 -->
<div class="mask" id="delMask">
  <div class="dialog">
    <h3>确认删除闹钟</h3>
    <p id="delAlarmText"></p>
    <div class="dialog-buttons">
      <button class="btn btn-danger" id="cancelDel">取消</button>
      <button class="btn btn-success" id="confirmDel">删除</button>
    </div>
  </div>
</div>

<!-- 响铃弹窗 -->
<div class="mask" id="ringMask">
  <div class="dialog">
    <h3 id="ringTitle">闹钟响啦！</h3>
    <p id="ringShowTime"></p>
    <div class="dialog-buttons">
      <button class="btn btn-success" id="snoozeBtn">延迟再响</button>
      <button class="btn btn-danger" id="stopRingBtn">停止</button>
    </div>
  </div>
</div>

<script>
// Tab 切换
const tabs = document.querySelectorAll('.tab-item');
const pages = {
  pageClock: document.getElementById('pageClock'),
  pageAlarm: document.getElementById('pageAlarm'),
  pageStopwatch: document.getElementById('pageStopwatch'),
  pageWorld: document.getElementById('pageWorld'),
  pageCountdown: document.getElementById('pageCountdown')
};

tabs.forEach(tab => {
  tab.onclick = function(){
    tabs.forEach(t => t.classList.remove('active'));
    for(let k in pages) pages[k].classList.remove('active');

    this.classList.add('active');
    pages[this.dataset.page].classList.add('active');
  };
});

// 右上角全屏切换
const orientationBtn = document.getElementById('orientationBtn');
orientationBtn.onclick = function(){
  if(!document.fullscreenElement){
    if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }else{
    if(document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }
};

//节日配置 公历节日
const holidayList = [
  {name:"元旦",month:1,day:1},
  {name:"春节",month:2,day:15},
  {name:"清明节",month:4,day:4},
  {name:"劳动节",month:5,day:1},
  {name:"端午节",month:6,day:19},
  {name:"中秋节",month:9,day:25},
  {name:"国庆节",month:10,day:1}
];

function getNextHoliday(){
  const now=new Date();
  const year=now.getFullYear();
  let minDiff=null;
  let target=null;
  holidayList.forEach(h=>{
    let d=new Date(year,h.month-1,h.day);
    if(d.getTime()<now.getTime()){
      d=new Date(year+1,h.month-1,h.day);
    }
    const diff=d.getTime()-now.getTime();
    if(minDiff===null||diff<minDiff){
      minDiff=diff;
      target={name:h.name,days:Math.ceil(diff/(1000*60*60*24))};
    }
  });
  return target;
}

function updateHolidayText(){
  const h=getNextHoliday();
  document.getElementById("holidayCount").innerText=`距离【${h.name}】还有 ${h.days} 天`;
}

// 添加闹钟蓝色展开按钮
const toggleAddBtn = document.getElementById('toggleAddBtn');
const slideAddBox = document.getElementById('slideAddBox');
let slideOpen = false;

toggleAddBtn.onclick = function(){
  slideOpen = !slideOpen;

  if(slideOpen){
    slideAddBox.classList.add('open');
    toggleAddBtn.innerText = '▲ 收起添加闹钟';
  }else{
    slideAddBox.classList.remove('open');
    toggleAddBtn.innerText = '▼ 添加闹钟';
  }
};

// 音频
let audioCtx = null;
let ringOscillators = [];
let customAudio = null;
let customRingUrl = null;

const customRingFile = document.getElementById('customRingFile');

customRingFile.onchange = function(e){
  const file = e.target.files[0];
  if(file){
    if(customRingUrl) URL.revokeObjectURL(customRingUrl);
    customRingUrl = URL.createObjectURL(file);
  }
};

function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBuiltinRing(type){
  initAudio();
  stopRing();
  const now = audioCtx.currentTime;
  ringOscillators = [];

  if(type === "beep"){
    for(let i = 0; i < 120; i++){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = 880; osc.type = "sine";
      gain.gain.setValueAtTime(0.22, now + i * 0.35);
      gain.gain.setValueAtTime(0, now + i * 0.35 + 0.12);
      osc.start(now + i * 0.35); osc.stop(now + i * 0.35 + 0.18);
      ringOscillators.push(osc);
    }
  }else if(type === "alarm"){
    for(let i = 0; i < 180; i++){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = i % 2 === 0 ? 920 : 1100; osc.type = "square";
      gain.gain.setValueAtTime(0.18, now + i * 0.28);
      gain.gain.setValueAtTime(0, now + i * 0.28 + 0.14);
      osc.start(now + i * 0.28); osc.stop(now + i * 0.28 + 0.18);

function makeEditable(wrapId, textId, minVal, maxVal, getCurrentValue, setter){
  const wrap = document.getElementById(wrapId);
  wrap.onclick = function(e){
    if(e.target.tagName === 'INPUT') return;
    const val = getCurrentValue();
    wrap.innerHTML = `<input type="number" min="${minVal}" max="${maxVal}" value="${String(val).padStart(2,'0')}">`;
    const inp = wrap.querySelector('input');
    inp.focus();
    inp.select();
    const finish = () => {
      let n = Number(inp.value);
      if(isNaN(n)) n = val;
      n = Math.max(minVal, Math.min(maxVal, n));
      setter(n);
      wrap.innerHTML = `<span id="${textId}">${String(n).padStart(2,'0')}</span>`;
    };
    inp.onblur = finish;
    inp.onkeydown = evt => {
      if(evt.key === 'Enter') finish();
    };
  };
}

// 主时钟更新
function checkRepeat(alarm, now){
  const wd = now.getDay();
  if(alarm.repeat === "once") return true;
  if(alarm.repeat === "workday") return wd >= 1 && wd <= 5;
  if(alarm.repeat === "weekend") return wd === 0 || wd === 6;
  if(alarm.repeat === "daily") return true;
  return true;
}

function updateMainTime(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  document.getElementById("mainBigTime").textContent = `${hh}:${mm}:${ss}`;
  const weekArr = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  const dateStr = `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 ${weekArr[now.getDay()]}`;
  document.getElementById("mainBigDate").textContent = dateStr;
  updateHolidayText();
  const checkTime = `${hh}:${mm}`;
  const sec = now.getSeconds();
  alarmList.forEach(alarm => {
    if(alarm.enabled && alarm.time === checkTime && sec === 0 && !alarm.triggered && checkRepeat(alarm, now)){
      alarm.triggered = true;
      saveAlarms();
      showAlarmDialog(alarm);
    }
  });
}

function formatMs(ms){
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const cent = Math.floor((ms % 1000) / 10);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cent).padStart(2,"0")}`;
}

function updateStopwatch(){
  if(swStartTs !== null) swElapsed = Date.now() - swStartTs;
  swDisplay.textContent = formatMs(swElapsed);
}

    this.textContent = "开始";
  }else{
    if(swElapsed === 0) swStartTs = Date.now();
    else swStartTs = Date.now() - swElapsed;
    swTimer = setInterval(updateStopwatch, 20);
    this.textContent = "暂停";
  }
};
document.getElementById("swLap").onclick = function(){
  lapNo++;
  lapList.innerHTML += `<div class="lap-item">计次 ${lapNo}：${formatMs(swElapsed)}</div>`;
};
document.getElementById("swReset").onclick = function(){
  clearInterval(swTimer);
  swTimer = null;
  swElapsed = 0;
  swStartTs = null;
  lapNo = 0;
  lapList.innerHTML = "";
  swDisplay.textContent = formatMs(0);
  document.getElementById("swStart").textContent = "开始";
};

// 倒计时
let cdTotal = 0;
let cdTimer = null;
const cdDisplay = document.getElementById("cdTime");

function renderCountdown(){
  const h = Math.floor(cdTotal / 3600);
  const m = Math.floor((cdTotal % 3600) / 60);
  const s = cdTotal % 60;
  cdDisplay.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

document.getElementById("cdStart").onclick = function(){
  if(cdTimer){
    clearInterval(cdTimer);
    cdTimer = null;
    this.textContent = "开始";
  }else{
    if(cdTotal <= 0) cdTotal = cdH * 3600 + cdM * 60 + cdS;
    cdTimer = setInterval(() => {
      cdTotal--;
      renderCountdown();
      if(cdTotal <= 0){
        clearInterval(cdTimer);
        cdTimer = null;
        document.getElementById("cdStart").textContent = "开始";
        playBuiltinRing("alarm");
        if(navigator.vibrate) navigator.vibrate([300, 200, 300]);
        alert("倒计时结束！");
        stopRing();
      }
    }, 1000);
    this.textContent = "暂停";
  }
};
document.getElementById("cdReset").onclick = function(){
  clearInterval(cdTimer);
  cdTimer = null;
  cdTotal = 0;
  refreshCdPicker();
  renderCountdown();
  document.getElementById("cdStart").textContent = "开始";
};

// 世界时间
const worldCities = [
  {name: "北京", offset: 8},
  {name: "东京", offset: 9},
  {name: "纽约", offset: -5},
  {name: "伦敦", offset: 0},
  {name: "悉尼", offset: 10},
  {name: "迪拜", offset: 4}
];

function renderWorldTime(){
  const listEl = document.getElementById("worldList");
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  let html = "";
  worldCities.forEach(city => {
    const t = new Date(utc + city.offset * 3600000);
    const hh = String(t.getHours()).padStart(2,"0");
    const mm = String(t.getMinutes()).padStart(2,"0");
    const ss = String(t.getSeconds()).padStart(2,"0");
    html += `
      <div class="world-item">
        <div class="world-city">${city.name}</div>
        <div class="world-time">${hh}:${mm}:${ss}</div>
      </div>`;
  });
  listEl.innerHTML = html;
}

// 初始化
refreshTimePicker();
refreshCdPicker();
renderAlarms();
updateMainTime();
renderWorldTime();

setInterval(() => {
  updateMainTime();
  renderWorldTime();
}, 1000);
</script>
