<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>其他云盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* 统一静态冷深蓝渐变，移除动态刺眼流动光效 */
        body {
            max-width: 640px;
            margin: 20px auto;
            padding: 0 12px;
            min-height: 100vh;
            background: linear-gradient(140deg, #08081a 0%, #0c0c2c 50%, #060622 100%);
            background-attachment: fixed;
        }
        /* 提取码卡片：低亮度磨砂，弱化蓝光 */
        #switchmore {
            background: rgba(30, 30, 60, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 18px;
            border: 1px solid rgba(0, 153, 204, 0.25);
            box-shadow: 0 0 8px rgba(0, 153, 204, 0.12);
        }
        .des-title {
            font-size: 15px;
            line-height: 1.6;
            color: #e8edff;
        }
        #change {
            font-size: 19px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            color: #88ccff;
            text-shadow: none;
        }
        #change1 {
            font-size: 14px;
            line-height: 1.7;
            color: #c5d8f5;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        /* 链接卡片：去掉亮粉刺眼边框，改用冷调 */
        .link-card {
            background: rgba(30, 30, 60, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(179, 157, 255, 0.22);
            box-shadow: 0 0 10px rgba(92, 47, 194, 0.12);
            transition: all 0.3s ease;
        }
        .link-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 153, 204, 0.35);
            box-shadow: 0 0 14px rgba(0, 153, 204, 0.18);
        }
        .link-card img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }
        .link-name {
            font-size: 14px;
            color: #e8edff;
            text-align: center;
            text-shadow: none;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- 提取码区域 -->
    <div class="message cards" id="switchmore">
        <div class="des-title">
            <span id="change">提&nbsp;取&nbsp;码&nbsp;：<br />
                <span id="change1">
                    💙123云盘提取码：无<br/>
                    💜阿里云盘提取码：无<br/>
                    💚移动云盘提取码：agmi<br/>
                    🧡蓝奏云盘提取码：无
                </span>
            </span>
        </div>
    </div>
    <!-- 第一组网盘 -->
    <div class="row">
        <div class="col">
            <a href="https://www.123865.com/s/ZNN8Vv-vngc3" target="_self">
                <div class="link-card cards">
                    <img src="图标/123云盘.png" alt="123云盘图标">
                    <span class="link-name">123云盘</span>
                </div>
            </a>
        </div>
        <div class="col">
            <a href="https://www.alipan.com/s/QnPsPyPCmkb" target="_self">
                <div class="link-card cards">
                    <img src="图标/阿里云盘.png" alt="阿里云盘图标">
                    <span class="link-name">阿里云盘</span>
                </div>
            </a>
        </div>
        <div class="col">
            <a href="https://yun.139.com/sharewap/#/m/i?2e6FMaTwqYU9w" target="_self">
                <div class="link-card cards">
                    <img src="图标/移动云盘.png" alt="移动云盘图标">
                    <span class="link-name">移动云盘</span>
                </div>
            </a>
        </div>
    </div>
    <!-- MIUI系统应用更新 蓝奏云 -->
    <div class="row" style="margin-top: 1.5rem;">
        <div class="col">
            <a href="https://wwa.lanzouo.com/b00z6coeh" target="_self">
                <div class="link-card cards">
                    <img src="图标/蓝奏云.png" alt="蓝奏云图标">
                    <span class="link-name">MIUI系统应用更新</span>
                </div>
            </a>
        </div>
    </div>
    <!-- 好用的软件大全 蓝奏云 -->
    <div class="row" style="margin-top: 1.5rem;">
        <div class="col">
            <a href="https://bhvip.lanzoux.com/u/%E5%BD%AA%E7%85%8CQQ1846055318" target="_self">
                <div class="link-card cards">
                    <img src="图标/蓝奏云.png" alt="蓝奏云图标">
                    <span class="link-name">好用的软件大全</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
