<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>频率发生器</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff}
body{
  background:radial-gradient(circle,#0a102a,#000);
  padding:8px;
  display:flex;align-items:center;justify-content:center
}
.main{
  width:100%;max-width:380px;
  background:rgba(0,0,0,0.8);
  border:1px solid #0ff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 0 20px #0ff
}
.title{
  text-align:center;color:#0ff;text-shadow:0 0 8px #0ff;
  font-size:15px;margin-bottom:12px
}
.channel{
  border:1px solid #f0f;border-radius:10px;
  padding:10px;background:rgba(10,10,30,0.5);
  margin-bottom:10px
}
.channel h3{
  color:#f0f;text-align:center;font-size:13px;
  margin-bottom:8px;text-shadow:0 0 6px #f0f
}
.item{margin-bottom:10px}
.item label{
  display:block;text-align:center;color:#0ff;
  font-size:12px;margin-bottom:4px
}
.slider{
  width:100%;height:6px;border-radius:3px;
  background:#111;-webkit-appearance:none;
  box-shadow:0 0 4px #0ff
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  background:#0ff;border-radius:4px;box-shadow:0 0 8px #0ff
}
.freq-input{
  width:100%;height:30px;
  background:#111;color:#fff;border:1px solid #0ff;border-radius:6px;
  text-align:center;font-size:12px;margin-top:4px
}
select{
  width:100%;height:32px;
  background:#111;color:#fff;border:1px solid #f0f;border-radius:6px;
  font-size:12px;text-align:center
}
.btns{display:flex;gap:8px;margin-top:10px}
button{
  flex:1;height:38px;border:none;border-radius:8px;
  font-size:14px;font-weight:bold;cursor:pointer
}
.start{background:#0ff;color:#000;box-shadow:0 0 10px #0ff}
.stop{background:#f0f;color:#000;box-shadow:0 0 10px #f0f}
button:disabled{background:#222;color:#666;box-shadow:none}
</style>
</head>
<body>

<div class="main">
  <div class="title">🎛️ 双声道频率发生器</div>

  <!-- 左声道 -->
  <div class="channel">
    <h3>左声道</h3>
    <div class="item">
      <label>频率 <span id="lfv">440</span>Hz</label>
      <input type="range" class="slider" id="lf" min="1" max="20000" value="440">
      <input type="number" class="freq-input" id="lfi" value="440">
    </div>
    <div class="item">
      <label>音量 <span id="lvv">50</span>%</label>
      <input type="range" class="slider" id="lv" min="0" max="100" value="50">
    </div>
    <div class="item">
      <select id="lw">
        <option value="sine">正弦波</option>
        <option value="square">方波</option>
        <option value="triangle">三角波</option>
        <option value="sawtooth">锯齿波</option>
      </select>
    </div>
  </div>

  <!-- 右声道 -->
  <div class="channel">
    <h3>右声道</h3>
    <div class="item">
      <label>频率 <span id="rfv">440</span>Hz</label>
      <input type="range" class="slider" id="rf" min="1" max="20000" value="440">
      <input type="number" class="freq-input" id="rfi" value="440">
    </div>
    <div class="item">
      <label>音量 <span id="rvv">50</span>%</label>
      <input type="range" class="slider" id="rv" min="0" max="100" value="50">
    </div>
    <div class="item">
      <select id="rw">
        <option value="sine">正弦波</option>
        <option value="square">方波</option>
        <option value="triangle">三角波</option>
        <option value="sawtooth">锯齿波</option>
      </select>
    </div>
  </div>

  <div class="btns">
    <button class="start" id="startBtn">发声</button>
    <button class="stop" id="stopBtn" disabled>停止</button>
  </div>
</div>

<script>
let audioCtx;
let oscL, gainL, panL;
let oscR, gainR, panR;

// 左声道
const lf = document.getElementById('lf');
const lfi = document.getElementById('lfi');
const lfv = document.getElementById('lfv');
const lv = document.getElementById('lv');
const lvv = document.getElementById('lvv');
const lw = document.getElementById('lw');

// 右声道
const rf = document.getElementById('rf');
const rfi = document.getElementById('rfi');
const rfv = document.getElementById('rfv');
const rv = document.getElementById('rv');
const rvv = document.getElementById('rvv');
const rw = document.getElementById('rw');

// 按钮
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

// 频率双向绑定
lf.addEventListener('input', () => {
  lfv.textContent = lf.value;
  lfi.value = lf.value;
  if (oscL) oscL.frequency.value = lf.value;
});
lfi.addEventListener('change', () => {
  let v = Math.max(1, Math.min(20000, Number(lfi.value) || 440));
  lfi.value = v; lf.value = v; lfv.textContent = v;
  if (oscL) oscL.frequency.value = v;
});

rf.addEventListener('input', () => {
  rfv.textContent = rf.value;
  rfi.value = rf.value;
  if (oscR) oscR.frequency.value = rf.value;
});
rfi.addEventListener('change', () => {
  let v = Math.max(1, Math.min(20000, Number(rfi.value) || 440));
  rfi.value = v; rf.value = v; rfv.textContent = v;
  if (oscR) oscR.frequency.value = v;
});

// 音量
lv.addEventListener('input', () => {
  lvv.textContent = lv.value;
  if (gainL) gainL.gain.value = lv.value / 100;
});
rv.addEventListener('input', () => {
  rvv.textContent = rv.value;
  if (gainR) gainR.gain.value = rv.value / 100;
});

// 波形
lw.addEventListener('change', () => {
  if (oscL) oscL.type = lw.value;
});
rw.addEventListener('change', () => {
  if (oscR) oscR.type = rw.value;
});

// 开始发声
startBtn.addEventListener('click', () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // 左声道
  panL = audioCtx.createStereoPanner();
  panL.pan.value = -1;
  gainL = audioCtx.createGain();
  gainL.gain.value = lv.value / 100;
  oscL = audioCtx.createOscillator();
  oscL.type = lw.value;
  oscL.frequency.value = lf.value;
  oscL.connect(gainL);
  gainL.connect(panL);
  panL.connect(audioCtx.destination);

  // 右声道
  panR = audioCtx.createStereoPanner();
  panR.pan.value = 1;
  gainR = audioCtx.createGain();
  gainR.gain.value = rv.value / 100;
  oscR = audioCtx.createOscillator();
  oscR.type = rw.value;
  oscR.frequency.value = rf.value;
  oscR.connect(gainR);
  gainR.connect(panR);
  panR.connect(audioCtx.destination);

  oscL.start();
  oscR.start();

  startBtn.disabled = true;
  stopBtn.disabled = false;
});

// 停止
stopBtn.addEventListener('click', () => {
  if (oscL) {
    oscL.stop();
    oscL = null;
  }
  if (oscR) {
    oscR.stop();
    oscR = null;
  }
  startBtn.disabled = false;
  stopBtn.disabled = true;
});
</script>
</body>
</html>
