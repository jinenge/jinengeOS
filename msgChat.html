<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>短信对话</title>
<style>
*{
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  margin:0;
  padding:0;
}
html, body {
  background:#ffffff;
  color:#111;
  height:100%;
}
.container {
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  position:relative;
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 16px 8px;
  gap:12px;
}
.back-btn{
  font-size:22px;
  cursor:pointer;
  padding:4px;
}
.chat-title{
  flex:1;
  font-size:18px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.setting-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
}
.chat-wrap{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.msg-other{
  align-self:flex-start;
  max-width:75%;
  background:#f0f1f3;
  border-radius:14px 14px 14px 4px;
  padding:12px 14px;
  font-size:15px;
}
.msg-me{
  align-self:flex-end;
  max-width:75%;
  background:#4080ff;
  color:#fff;
  border-radius:14px 14px 4px 14px;
  padding:12px 14px;
  font-size:15px;
}
.time-tip{
  text-align:center;
  font-size:12px;
  color:#999;
  margin:4px 0;
}
.input-area{
  display:flex;
  gap:8px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid #eee;
  align-items:center;
}
#msgInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:999px;
  padding:10px 16px;
  font-size:15px;
  outline:none;
}
.send-btn{
  background:#4080ff;
  color:#fff;
  border:none;
  border-radius:999px;
  padding:10px 18px;
  font-size:15px;
  cursor:pointer;
}
/* 设置弹窗 */
.pop-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:99;
}
.pop-wrap{
  position:absolute;
  bottom:0;
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:20px 20px 0 0;
  max-height:85vh;
  overflow-y:auto;
  padding:20px 16px;
}
.pop-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:12px;
  text-align:center;
}
.group{
  border-radius:14px;
  background:#f7f8fa;
  overflow:hidden;
  margin-bottom:12px;
}
.group-title{
  font-size:13px;
  color:#888;
  padding:10px 14px 4px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-top:1px solid #fff;
  cursor:pointer;
}
.row .left{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.row .name{
  font-size:15px;
}
.row .desc{
  font-size:12px;
  color:#777;
}
.toggle{
  width:48px;
  height:28px;
  border-radius:999px;
  background:#ddd;
  position:relative;
  transition:0.2s;
  cursor:pointer;
}
.toggle.on{
  background:#4080ff;
}
.toggle::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:0.2s;
}
.toggle.on::after{
  left:23px;
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="back-btn" onclick="goBackMms()">‹</div>
    <div class="chat-title" id="chatName"></div>
    <div class="setting-icon" onclick="openSetting()">⚙</div>
  </div>
  <div class="chat-wrap" id="chatBox"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="输入短信内容">
    <button class="send-btn" onclick="sendMsg()">回复</button>
  </div>
</div>

<!-- 会话设置弹窗 -->
<div class="pop-mask" id="popMask" onclick="closeSetting()">
  <div class="pop-wrap" onclick="event.stopPropagation()">
    <div class="pop-title">会话设置</div>
    <div class="group">
      <div class="group-title">消息提醒</div>
      <div class="row">
        <div class="left"><div class="name">消息提醒</div><div class="desc">收到短信提示</div></div>
        <div class="toggle" data-key="chatNotify" onclick="saveToggle(this)"></div>
      </div>
      <div class="row">
        <div class="left"><div class="name">静音通知</div><div class="desc">免打扰</div></div>
        <div class="toggle" data-key="chatSilent" onclick="saveToggle(this)"></div>
      </div>
    </div>
    <div class="group">
      <div class="group-title">会话操作</div>
      <div class="row" onclick="clearChat()">
        <div class="left"><div class="name">清空聊天记录</div><div class="desc">清空本条会话全部消息</div></div>
        <span>›</span>
      </div>
      <div class="row" onclick="deleteSession()">
        <div class="left"><div class="name">删除会话</div><div class="desc">删除整个对话</div></div>
        <span>›</span>
      </div>
    </div>
  </div>
</div>

<script>
// 获取传参
let chatTarget = decodeURIComponent(new URLSearchParams(location.search).get("name") || "");
let previewMsg = decodeURIComponent(new URLSearchParams(location.search).get("preview") || "");
document.getElementById("chatName").innerText = chatTarget;
const chatKey = "sms_chat_"+chatTarget;
const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");

// 读取本地存储消息
function loadChat(){
  let data = JSON.parse(localStorage.getItem(chatKey) || `[{"type":"other","text":"${previewMsg}"}]`);
  renderChat(data);
}
function renderChat(list){
  chatBox.innerHTML = `<div class="time-tip">今天</div>`;
  list.forEach(item=>{
    if(item.type==="other"){
      chatBox.innerHTML += `<div class="msg-other">${item.text}</div>`
    }else{
      chatBox.innerHTML += `<div class="msg-me">${item.text}</div>`
    }
  })
  chatBox.scrollTop = chatBox.scrollHeight;
}
function saveChat(list){
  localStorage.setItem(chatKey, JSON.stringify(list));
}

// 回复：唤起真机原生短信（sms协议，安卓生效）
function sendMsg(){
  const text = msgInput.value.trim();
  if(!text) return;
  // 存入网页会话记录
  let list = JSON.parse(localStorage.getItem(chatKey) || `[{"type":"other","text":"${previewMsg}"}]`);
  list.push({type:"me",text:text});
  saveChat(list);
  renderChat(list);
  // 调用系统短信APP
  location.href = `sms:${chatTarget}?body=${encodeURIComponent(text)}`;
  msgInput.value = "";
}
function clearChat(){
  if(confirm("确定清空全部聊天记录？")){
    localStorage.removeItem(chatKey);
    loadChat();
  }
}
function deleteSession(){
  if(confirm("确定删除这个会话？")){
    localStorage.removeItem(chatKey);
    goBackMms();
  }
}
function openSetting(){ document.getElementById("popMask").style.display="block"; }
function closeSetting(){ document.getElementById("popMask").style.display="none"; }
function saveToggle(el){
  const key = el.dataset.key + "_" + chatTarget;
  el.classList.toggle("on");
  localStorage.setItem(key, el.classList.contains("on") ? "1" : "0");
}
function loadSetting(){
  document.querySelectorAll(".toggle[data-key]").forEach(t=>{
    const k = t.dataset.key + "_" + chatTarget;
    if(localStorage.getItem(k) === "1") t.classList.add("on");
  })
}
loadChat();
loadSetting();

// 返回短信列表
function goBackMms(){
  location.href="mms.html";
}
// iframe顶层返回，直接回到桌面
function goBack(){
  parent.postMessage(JSON.stringify({type:"closePage"}),"*");
}
window.addEventListener('popstate',()=>goBack());
history.pushState({},'');
</script>
</body>
</html>
